[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dnsmos-trainable"
version = "0.1.0"
description = "Trainable PyTorch reimplementation of DNSMOS P.835 with ONNX exports: int8 QDQ forward and fused forward+backward loss graphs for on-device training (incl. STM32N6)"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { file = "LICENSE" }
dependencies = [
    "numpy>=1.26",
    "onnx>=1.16,<2",
    "onnxruntime>=1.19",
    "onnxscript>=0.7.1",
    "soundfile>=0.12",
    "soxr>=0.3",
    "torch>=2.4",
    "tqdm>=4.60",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-xdist>=3"]
qat = ["torchao"]

[tool.hatch.build.targets.wheel]
packages = ["src/dnsmos_trainable"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long-running tests (quantization sweeps); deselect with -m 'not slow'",
]
